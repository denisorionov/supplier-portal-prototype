<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Портал поставщиков — поиск действующих договоров для вашей закупки.">
    <title>Портал поставщиков</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/vk-sans-display-medium.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="assets/fonts/vk-sans-display-regular.woff" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="assets/portal.css?v=20261004-1">
    <script src="assets/portal.js?v=20261004-1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#purchase-query">Перейти к поиску</a>

    <header class="header">
      <div class="container header__inner">
        <a class="brand" href="./" aria-label="Портал поставщиков — главная">
          <svg class="brand__icon" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="currentColor"/>
            <path d="M11.5 25V11.5H24.5V25M17.5 25V17.5H24.5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Портал поставщиков</span>
        </a>
      </div>
    </header>

    <main class="container main">
      <section class="search-section" aria-labelledby="page-title">
        <h1 id="page-title">Найдите договор<br><span>для вашей закупки</span></h1>
        <p class="description" id="search-description">Введите, что вам нужно приобрести. Портал покажет действующие договоры, поставщиков, доступный лимит и срок действия, а также подскажет дальнейшие шаги</p>

        <form class="search-form" id="search-form" role="search" novalidate>
          <label class="visually-hidden" for="purchase-query">Что вы хотите приобрести?</label>
          <div class="search-field" id="search-field">
            <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="10.75" cy="10.75" r="6.75" stroke="currentColor" stroke-width="1.8"/>
              <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input id="purchase-query" name="query" type="search" placeholder="Что вы хотите приобрести?" maxlength="240" autocomplete="off" enterkeyhint="search" aria-describedby="search-description search-feedback" spellcheck="false">
            <button class="clear-button" id="clear-query" type="button" aria-label="Очистить поиск" hidden>
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="m6 6 8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="search-button" id="search-button" type="submit">
              <span class="spinner" aria-hidden="true" hidden></span>
              <span id="button-label">Найти</span>
            </button>
          </div>
          <p class="search-feedback" id="search-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>

        <noscript><p class="noscript-note">Чтобы воспользоваться поиском, включите JavaScript в браузере.</p></noscript>
      </section>
    </main>
  </body>
</html>
